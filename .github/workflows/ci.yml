name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # cache disabled: standalone has no pnpm-lock.yaml, monorepo lock is at root
      - run: pnpm install --no-frozen-lockfile
        # monorepo-aware fallback if run from root, otherwise direct
      - run: pnpm --filter @paullotz/interview-me typecheck || pnpm typecheck
      - run: pnpm --filter @paullotz/interview-me test || pnpm test
      - run: pnpm --filter @paullotz/interview-me build || pnpm build
